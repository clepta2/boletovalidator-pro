<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BoletoValidator Pro — Playground &amp; Demonstração</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card: #111827;
      --accent: #f59e0b;
      --accent-glow: rgba(245, 158, 11, 0.25);
      --text: #f9fafb;
      --text-muted: #94a3b8;
      --border: rgba(255,255,255,0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .container { max-width: 820px; width: 100%; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 99px;
      background: rgba(245,158,11,0.12);
      border: 1px solid rgba(245,158,11,0.3);
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 16px;
    }
    h1 { font-size: 32px; font-weight: 800; margin-bottom: 8px; letter-spacing: -0.5px; }
    p.lead { color: var(--text-muted); font-size: 15px; margin-bottom: 28px; line-height: 1.6; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    .input-group { display: flex; gap: 12px; margin-bottom: 16px; }
    input {
      flex: 1;
      background: #040711;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      color: #fff;
      font-size: 14px;
      font-family: 'JetBrains Mono', monospace;
      outline: none;
      transition: all 0.2s;
    }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
    button {
      background: var(--accent);
      color: #040711;
      font-weight: 700;
      font-size: 14px;
      padding: 0 24px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover { opacity: 0.9; transform: translateY(-1px); }
    .actions { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .btn-secondary {
      background: rgba(255,255,255,0.06);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 12px;
    }
    .output-box {
      background: #040711;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: #38bdf8;
      white-space: pre-wrap;
      word-break: break-all;
      min-height: 150px;
      line-height: 1.5;
    }
    footer { text-align: center; color: var(--text-muted); font-size: 13px; margin-top: auto; padding-top: 40px; }
    footer a { color: var(--accent); text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">⚡ Validação Local em RAM (0ms) ou Cloudflare Edge (&lt;5ms)</div>
    <h1>BoletoValidator Pro Playground</h1>
    <p class="lead">Validação oficial FEBRABAN com conversão em código de barras de 44 dígitos e extração de dados nominais.</p>

    <div class="card">
      <div class="input-group">
        <input type="text" id="boletoInput" placeholder="Cole a linha digitável ou código de barras" value="34191.09008 00000.283101 09257.470006 4 96450000012500">
        <button onclick="validar()">Validar Agora</button>
      </div>
      <div class="actions">
        <button class="btn-secondary" onclick="gerarBoletoAoVivo()">🎲 Gerar Novo Boleto de Teste</button>
        <button class="btn-secondary" onclick="exemploBancario()">🏦 Exemplo Itaú (R$ 125,00)</button>
        <button class="btn-secondary" onclick="exemploConcessionaria()">💡 Exemplo Concessionária (R$ 150,00)</button>
        <button class="btn-secondary" onclick="exemploAdulterado()">❌ Testar Linha Adulterada</button>
      </div>
      <div id="barcodeContainer" style="display:none;background:#fff;padding:16px;border-radius:10px;margin-bottom:16px;text-align:center;box-shadow:0 4px 15px rgba(0,0,0,0.3)">
        <div id="barcodeSvgWrapper" style="color:#000;max-width:500px;margin:0 auto"></div>
        <div id="barcodeText" style="font-family:'JetBrains Mono',monospace;font-size:12px;color:#000;font-weight:700;margin-top:6px;letter-spacing:1px"></div>
      </div>
      <div class="output-box" id="resultOutput">Pronto para validar.</div>
    </div>

    <footer>
      Parte oficial do ecossistema <a href="https://ponte.ozpro.com.br" target="_blank">Ponte API Marketplace</a> &bull; Código aberto no <a href="https://github.com/clepta2/boletovalidator-pro" target="_blank">GitHub</a>
    </footer>
  </div>

  <script type="module">
    import { BoletoValidatorPro } from '../boletovalidator-pro.js';

    window.validar = function() {
      const val = document.getElementById('boletoInput').value;
      const res = BoletoValidatorPro.validarLocal(val);
      document.getElementById('resultOutput').innerText = JSON.stringify(res, null, 2);

      const bContainer = document.getElementById('barcodeContainer');
      const bWrapper = document.getElementById('barcodeSvgWrapper');
      const bText = document.getElementById('barcodeText');
      if (res.valido && res.barcodeSvg) {
        bContainer.style.display = 'block';
        bWrapper.innerHTML = res.barcodeSvg;
        bText.innerText = res.codigoBarras;
      } else {
        bContainer.style.display = 'none';
      }
    };

    window.exemploBancario = function() {
      document.getElementById('boletoInput').value = '34191.09008 00000.283101 09257.470006 4 96450000012500';
      window.validar();
    };

    window.exemploConcessionaria = function() {
      document.getElementById('boletoInput').value = '83620000001-3 50000053800-8 00000000000-0 00000000000-0';
      window.validar();
    };

    window.exemploAdulterado = function() {
      document.getElementById('boletoInput').value = '34191.09009 00000.283101 09257.470006 4 96450000012500';
      window.validar();
    };

    window.gerarBoletoAoVivo = function() {
      const valorRandom = (Math.random() * 500 + 10).toFixed(2);
      const novo = BoletoValidatorPro.gerarBoleto({ valor: Number(valorRandom) });
      document.getElementById('boletoInput').value = novo.linhaFormatada;
      window.validar();
    };

    window.validar();
  </script>
</body>
</html>
